openapi: 3.0.3
info:
  title: Solar Fleet Management API
  version: 0.1.0
  description: |
    Generated from ApiController (26 operations). Demo mode (APP_DEMO_DATA=true) is unauthenticated.
    Otherwise every /api request needs the X-Operator-Key header. This is a shared deployment key,
    not per-user authentication. Errors are RFC 9457 problem+json and include a requestId.
servers:
  - url: http://localhost:8080
security:
  - OperatorKey: []
components:
  securitySchemes:
    OperatorKey: {type: apiKey, in: header, name: X-Operator-Key}
  responses:
    Problem:
      description: Problem details (status, title, detail, requestId)
      content:
        application/problem+json:
          schema: {type: object}
paths:
  /api/v1/dashboard/summary:
    get:
      operationId: dashboard
      summary: Fleet dashboard summary
      responses:
        '200': {description: OK}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/integrations/catalog:
    get:
      operationId: integrationCatalog
      summary: Supported integration catalog (capabilities per manufacturer)
      responses:
        '200': {description: OK}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/activity:
    get:
      operationId: activity
      summary: Recent activity
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/alarms:
    get:
      operationId: alarms
      summary: List alarms
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/alarms/{id}/acknowledge:
    post:
      operationId: acknowledgeAlarm
      summary: Acknowledge alarm
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/alarms/{id}/clear:
    post:
      operationId: clearAlarm
      summary: Clear alarm
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/costs:
    get:
      operationId: allCosts
      summary: List all costs
      responses:
        '200': {description: OK}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/devices:
    get:
      operationId: devices
      summary: List inverters
