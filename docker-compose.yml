# Local / demo stack:  docker compose up --build   ->  http://localhost:8080
#
# Network layout (each arrow is the only path between the two sides):
#   host --(127.0.0.1:8080)--> proxy --[edge_app, internal]--> app --[data, internal]--> db
#                                                               app --[egress]--> internet (OEM cloud APIs)
# The database has no host port and no internet route; the app is not reachable except through the proxy.
name: solar-fleet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solarfleet
      POSTGRES_USER: solarfleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarfleet}
    volumes:
      - solarfleet-pg:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarfleet -d solarfleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/solarfleet
      DB_USERNAME: solarfleet
      DB_PASSWORD: ${POSTGRES_PASSWORD:-solarfleet}
      APP_DEMO_DATA: ${APP_DEMO_DATA:-true}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      TENANT_ID: ${TENANT_ID:-}
      TENANT_NAME: ${TENANT_NAME:-Operator}
      FORWARD_HEADERS: framework
      POLLING_INITIAL_DELAY_MS: 1500
      POLLING_FIXED_DELAY_MS: ${POLLING_FIXED_DELAY_MS:-60000}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-90}
    networks: [edge_app, data, egress]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    ports:
      # Loopback by default because demo mode is unauthenticated. Set BIND_ADDRESS=0.0.0.0 only behind a firewall/TLS.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks: [public, edge_app]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  public:
  edge_app:
    internal: true
  data:
    internal: true
  egress:

volumes:
  solarfleet-pg:
