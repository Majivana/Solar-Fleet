networks:
  solarfleet:
    driver: bridge
    name: solarfleet-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solarfleet
      POSTGRES_USER: solarfleet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solarfleet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - solarfleet-pg:/var/lib/postgresql/data
    networks:
      - solarfleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarfleet -d solarfleet"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/solarfleet
      DB_USERNAME: solarfleet
      DB_PASSWORD: ${DB_PASSWORD:-solarfleet}
      APP_DEMO_DATA: ${APP_DEMO_DATA:-true}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      TENANT_ID: ${TENANT_ID:-}
      POLLING_INITIAL_DELAY_MS: 1500
      POLLING_FIXED_DELAY_MS: 60000
      OEM_CONNECT_TIMEOUT_MS: 5000
      OEM_READ_TIMEOUT_MS: 15000
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - solarfleet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  solarfleet-pg:
