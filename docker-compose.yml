services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solarfleet
      POSTGRES_USER: solarfleet
      POSTGRES_PASSWORD: solarfleet
    ports:
      - "5432:5432"
    volumes:
      - solarfleet-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarfleet -d solarfleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/solarfleet
      DB_USERNAME: solarfleet
      DB_PASSWORD: solarfleet
      APP_DEMO_DATA: "true"
      POLLING_INITIAL_DELAY_MS: 1500
      POLLING_FIXED_DELAY_MS: 60000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  solarfleet-pg:
