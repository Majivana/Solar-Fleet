<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f4">
  <title>Solar Fleet | Operations</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f6f4;
      --surface: #fff;
      --ink: #202922;
      --muted: #647168;
      --line: #dfe5df;
      --green: #236c49;
      --green-soft: #e9f3ed;
      --amber: #98610e;
      --amber-soft: #fbf2df;
      --red: #a63d35;
      --red-soft: #faeae8;
      --blue: #356a88;
      --shadow: 0 2px 8px #1b30200a;
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
    button, input, select, textarea { font: inherit }
    button, a, select { cursor: pointer }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #3b8c64; outline-offset: 2px }
    .shell { min-height: 100vh }
    .topbar { height: 66px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3 }
    .brand { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:700; letter-spacing:-.02em }
    .brand-mark { width:29px; height:29px; display:grid; place-items:center; border:1.5px solid var(--green); border-radius:7px; color:var(--green); font-size:17px; font-weight:700 }
    .top-actions { display:flex; align-items:center; gap:12px }
    .demo-tag { color:var(--amber); background:var(--amber-soft); padding:5px 9px; border-radius:4px; font-size:11px; font-weight:700; letter-spacing:.04em }
    .layout { display:grid; grid-template-columns:210px minmax(0,1fr); max-width:1580px; margin:0 auto }
    nav { padding:24px 14px; border-right:1px solid var(--line); min-height:calc(100vh - 66px); background:#f9faf8 }
    .nav-label { margin:0 10px 9px; color:#879188; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase }
    .nav-list { display:grid; gap:3px; margin-bottom:27px }
    .nav-item { width:100%; text-align:left; border:0; background:transparent; color:#445047; border-radius:5px; padding:9px 10px; font-weight:550 }
    .nav-item:hover { background:#edf1ed }
    .nav-item[aria-current="page"] { background:var(--green-soft); color:var(--green); font-weight:700 }
    main { min-width:0; padding:30px clamp(18px,3vw,42px) 48px }
    .page-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:24px }
    h1 { margin:0; font-size:25px; line-height:1.25; letter-spacing:-.035em; font-weight:700 }
    h2 { margin:0; font-size:16px; line-height:1.3; letter-spacing:-.015em }
    h3 { margin:0; font-size:14px }
    .subtitle { margin-top:5px; color:var(--muted); font-size:13px }
    .button { display:inline-flex; justify-content:center; align-items:center; gap:7px; min-height:36px; padding:7px 12px; border:1px solid #cad4cc; border-radius:5px; background:#fff; color:#334238; font-weight:650; text-decoration:none }
    .button:hover { background:#f7f9f7; border-color:#aab9ae }
    .button.primary { background:var(--green); border-color:var(--green); color:white }
    .button.primary:hover { background:#1d5c3d }
    .button.danger { color:var(--red); border-color:#e6c2bd }
    .button.small { min-height:30px; padding:4px 8px; font-size:12px }
    .button:disabled { cursor:not-allowed; opacity:.55 }
    .inline-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px }
    .metric-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:17px }
    .metric { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:15px 16px; box-shadow:var(--shadow); min-width:0 }
    .metric-label { color:var(--muted); font-size:12px; font-weight:550 }
    .metric-value { margin-top:5px; font-size:24px; line-height:1.2; letter-spacing:-.035em; font-weight:700; font-variant-numeric:tabular-nums }
    .metric-note { margin-top:4px; font-size:11px; color:var(--muted) }
    .content-grid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr); gap:15px; align-items:start }
    .stack { display:grid; gap:15px; min-width:0 }
    .panel { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow) }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:15px 17px; border-bottom:1px solid var(--line) }
    .panel-body { padding:15px 17px }
    .panel-title-note { margin-top:3px; color:var(--muted); font-size:12px }
    .status { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:3px 7px; border-radius:4px; font-size:11px; font-weight:700; background:#eef1ee; color:#59645c }
    .status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor }
    .status.online, .status.healthy, .status.active, .status.operational, .status.connected { color:var(--green); background:var(--green-soft) }
    .status.offline, .status.fault, .status.alarm, .status.critical, .status.sync-error { color:var(--red); background:var(--red-soft) }
    .status.warning, .status.maintenance, .status.stale, .status.demo-data { color:var(--amber); background:var(--amber-soft) }
    .status.unknown, .status.unverified, .status.retired { color:#66716a; background:#edf0ed }
    .attention-list { display:grid }
    .attention-row { display:grid; grid-template-columns:1fr auto; gap:8px 12px; padding:11px 0; border-bottom:1px solid #edf0ed; align-items:center }
    .attention-row:last-child { border:0; padding-bottom:0 }
    .attention-title { font-weight:650 }
    .attention-meta { color:var(--muted); font-size:12px }
    .attention-link { color:var(--green); text-decoration:none; font-size:12px; font-weight:700; white-space:nowrap }
    .attention-link:hover { text-decoration:underline }
    .table-wrap { width:100%; overflow:auto }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:12px }
    th { padding:9px 11px; border-bottom:1px solid var(--line); color:#69756c; background:#fafbfa; font-size:10px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; font-weight:700 }
    td { padding:11px; border-bottom:1px solid #edf0ed; vertical-align:middle }
    tbody tr:last-child td { border-bottom:0 }
    tbody tr:hover { background:#fbfcfb }
    .link-button { padding:0; border:0; background:none; color:var(--green); text-align:left; font-weight:650 }
    .link-button:hover { text-decoration:underline }
    .mono { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; white-space:nowrap }
    .muted { color:var(--muted) }
    .small-text { font-size:12px }
    .empty { padding:24px 12px; text-align:center; color:var(--muted) }
    .empty strong { display:block; color:var(--ink); margin-bottom:4px }
    .toolbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; padding:12px 15px; border-bottom:1px solid var(--line) }
    .field-control { min-height:35px; padding:7px 9px; border:1px solid #cbd4cd; border-radius:4px; background:white; color:var(--ink); max-width:100% }
    .toolbar input[type="search"] { min-width:200px; flex:1 }
    .project-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px }
    .project-card { padding:16px; background:#fff; border:1px solid var(--line); border-radius:6px }
    .project-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px }
    .project-name { font-size:15px; font-weight:700 }
    .project-meta { color:var(--muted); font-size:12px; margin-top:3px }
    .project-numbers { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; padding:12px 0; border-top:1px solid #edf0ed; border-bottom:1px solid #edf0ed }
    .project-number strong { display:block; font-size:16px; font-variant-numeric:tabular-nums }
    .project-number span { color:var(--muted); font-size:11px }
    .tabs { display:flex; overflow:auto; border-bottom:1px solid var(--line); margin:-5px 0 17px; gap:20px }
    .tab { border:0; border-bottom:2px solid transparent; padding:10px 1px; background:none; color:var(--muted); white-space:nowrap; font-weight:650 }
    .tab[aria-selected="true"] { color:var(--green); border-bottom-color:var(--green) }
    .detail-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:15px }
    .detail-item { background:#f8faf8; border:1px solid #e8ede8; border-radius:4px; padding:11px }
    .detail-item span { display:block; color:var(--muted); font-size:11px }
    .detail-item strong { display:block; margin-top:4px; font-size:14px; overflow-wrap:anywhere }
    .bar-list { display:grid; gap:10px }
    .bar-row { display:grid; grid-template-columns:100px minmax(50px,1fr) 55px; align-items:center; gap:10px; font-size:12px }
    .bar-track { height:9px; background:#edf1ed; overflow:hidden; border-radius:5px }
    .bar-fill { display:block; height:100%; background:#508b69; border-radius:5px }
    .financial-line { display:flex; justify-content:space-between; gap:15px; padding:8px 0; border-bottom:1px solid #edf0ed }
    .financial-line:last-child { border-bottom:0 }
    .financial-line strong { font-variant-numeric:tabular-nums; text-align:right }
    .notice { padding:10px 12px; border-left:3px solid #c59a46; background:#fcf8ed; color:#604c25; font-size:12px }
    .error-box { padding:14px; border:1px solid #e6c2bd; border-radius:5px; color:#7d302a; background:#fff8f7 }
    .screen-reader { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap }
    dialog { width:min(570px,calc(100vw - 26px)); max-height:calc(100vh - 30px); overflow:auto; padding:0; border:1px solid #d3dbd4; border-radius:7px; color:var(--ink); box-shadow:0 20px 60px #17221933 }
    dialog::backdrop { background:#17221c66 }
    .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 19px; border-bottom:1px solid var(--line) }
    .dialog-body { padding:17px 19px }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px }
    .form-field { display:grid; gap:5px; min-width:0 }
    .form-field.full { grid-column:1/-1 }
    .form-field label { font-size:12px; font-weight:650 }
    .form-field label .required { color:var(--red) }
    .form-field input, .form-field select, .form-field textarea { width:100%; min-height:37px; border:1px solid #cbd4cd; border-radius:4px; padding:8px 9px; background:white }
    .form-field textarea { min-height:75px; resize:vertical }
    .form-hint { color:var(--muted); font-size:11px }
    .form-error { display:none; color:var(--red); font-size:12px; margin-bottom:10px }
    .dialog-actions { display:flex; justify-content:space-between; gap:10px; margin-top:17px; padding-top:13px; border-top:1px solid var(--line) }
    .dialog-actions-right { display:flex; justify-content:flex-end; gap:8px }
    .loading { padding:35px; text-align:center; color:var(--muted) }
    .footer-note { margin-top:18px; color:#7a857d; font-size:11px }
    @media(max-width:1050px) { .layout { grid-template-columns:170px minmax(0,1fr) } .metric-row { grid-template-columns:repeat(3,minmax(0,1fr)) } .content-grid { grid-template-columns:1fr } }
    @media(max-width:700px) {
      .topbar { height:58px; padding:0 14px }
      .layout { display:block }
      nav { min-height:0; padding:7px 10px; border:0; border-bottom:1px solid var(--line); overflow:auto }
      .nav-label { display:none }
      .nav-list { display:flex; width:max-content; gap:3px; margin:0 }
      .nav-item { width:auto; padding:8px 10px; white-space:nowrap; font-size:12px }
      main { padding:21px 13px 35px }
      .page-heading { margin-bottom:17px }
      h1 { font-size:22px }
      .metric-row { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
      .metric { padding:12px }
      .metric-value { font-size:21px }
      .project-grid { grid-template-columns:1fr }
      .detail-grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
      .form-grid { grid-template-columns:1fr }
      .form-field.full { grid-column:auto }
      .demo-tag { display:none }
      .top-actions { gap:6px }
      .button { min-height:34px; padding:6px 9px; font-size:12px }
    }
    @media print {
      body { background:white; font-size:11px }
      .topbar, nav, .page-heading .button, .toolbar, .tabs, .no-print, .footer-note { display:none!important }
      .layout { display:block; max-width:none }
      main { padding:0 }
      .panel, .metric, .project-card { box-shadow:none; break-inside:avoid }
      .table-wrap { overflow:visible }
      th { background:#f1f3f1!important }
      .project-grid { grid-template-columns:1fr 1fr }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><span>Solar Fleet</span></div>
    <div class="top-actions">
      <span id="demoTag" class="demo-tag" hidden>DEMO DATA</span>
      <span id="lastUpdated" class="muted small-text" aria-live="polite">Loading fleet…</span>
      <button class="button primary" data-action="add-inverter">+ Add Inverter</button>
    </div>
  </header>
  <div class="layout">
    <nav aria-label="Main navigation">
      <p class="nav-label">Operations</p>
      <div class="nav-list" role="list">
        <button class="nav-item" data-page="overview" aria-current="page">Overview</button>
        <button class="nav-item" data-page="projects">Projects</button>
        <button class="nav-item" data-page="fleet">Fleet</button>
        <button class="nav-item" data-page="alarms">Alarms</button>
      </div>
      <p class="nav-label">Management</p>
      <div class="nav-list" role="list">
        <button class="nav-item" data-page="financials">Financials</button>
        <button class="nav-item" data-page="reports">Reports</button>
        <button class="nav-item" data-page="integrations">Integrations</button>
      </div>
    </nav>
    <main id="main" tabindex="-1"><div class="loading" role="status">Loading fleet information…</div></main>
  </div>
</div>

<dialog id="actionDialog" aria-labelledby="dialogTitle">
  <div class="dialog-head"><h2 id="dialogTitle"></h2><button class="button small" type="button" data-action="close-dialog" aria-label="Close dialog">Close</button></div>
  <form id="actionForm" class="dialog-body"></form>
</dialog>

<script>
(() => {
  "use strict";
  const state = { page: "overview", selectedProject: null, reportProject: "", reportFrom: "", reportTo: "", projectTab: "overview", selectedDevice: null, telemetry: [], historyDays: 7, historyFrom: "", historyTo: "", data: null, reportType: "fleet" };
  const main = document.getElementById("main");
  const dialog = document.getElementById("actionDialog");
  const form = document.getElementById("actionForm");
  let operatorKey = "";
  let keyPrompt = null;
  const $ = (selector, root = document) => root.querySelector(selector);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const money = (value, currency = "ZAR") => value == null ? "—" : new Intl.NumberFormat("en-ZA", { style: "currency", currency, maximumFractionDigits: 2 }).format(Number(value));
  const number = (value, digits = 1) => value == null ? "—" : Number(value).toLocaleString("en-ZA", { maximumFractionDigits: digits });
  const date = value => value ? new Intl.DateTimeFormat("en-ZA", { dateStyle: "medium" }).format(new Date(value)) : "—";
  const dateTime = value => value ? new Intl.DateTimeFormat("en-ZA", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value)) : "Never";
  const localDateValue = () => {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  };
  const api = async (path, options = {}) => {
    const usedOperatorKey = Boolean(operatorKey);
    const send = () => {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (operatorKey) headers["X-Operator-Key"] = operatorKey;
      return fetch(path, { ...options, headers });
    };
    let response = await send();
    if (response.status === 401) {
      if (usedOperatorKey) throw new Error("The operator access key was rejected. Reload the page to try again.");
      if (!keyPrompt) keyPrompt = Promise.resolve(window.prompt("Enter the operator access key configured for this fleet."));
      const entered = await keyPrompt;
      if (!entered) throw new Error("An operator access key is required.");
      operatorKey = entered;
      response = await send();
      if(response.status===401) throw new Error("The operator access key was rejected. Reload the page to try again.");
    }
    if (!response.ok) {
      const body = await response.text();
      let message = body;
      try { const parsed = JSON.parse(body); message = parsed.detail || parsed.message || parsed.error || parsed.title || body; } catch {}
      throw new Error(message || `Request failed (${response.status})`);
    }
    if (response.status === 204) return null;
    return response.json();
  };
  const className = text => String(text || "").toLowerCase().replaceAll(/[^a-z0-9-]/g, "-");
  const status = (text, extra = "") => `<span class="status ${className(text)} ${extra}">${esc(text || "Unknown")}</span>`;
  const selectedProject = () => (state.data?.projects || []).find(project => project.id === state.selectedProject);
  const reload = async () => {
    main.innerHTML = `<div class="loading" role="status">Updating fleet information…</div>`;
    try {
      const [summary, projects, devices, alarms, activity, sites, costs] = await Promise.all([
        api("/api/v1/dashboard/summary"), api("/api/v1/projects"), api("/api/v1/devices?includeRetired=true"),
        api("/api/v1/alarms?includeCleared=true"), api("/api/v1/activity"), api("/api/v1/sites"), api("/api/v1/costs")
      ]);
      projects.forEach(project => { project._costs = costs.filter(cost=>cost.projectId===project.id); });
      state.data = { summary, projects, devices, alarms, activity, sites, costs };
      if (state.selectedProject && !projects.some(project => project.id === state.selectedProject)) state.selectedProject = null;
      $("#demoTag").hidden = !summary.demoMode;
      $("#lastUpdated").textContent = `Updated ${new Date().toLocaleTimeString("en-ZA", { hour: "2-digit", minute: "2-digit" })}`;
      render();
    } catch (error) {
      $("#lastUpdated").textContent = "Could not update";
      main.innerHTML = `<div class="page-heading"><div><h1>Fleet overview</h1><p class="subtitle">Fleet information could not be loaded.</p></div></div><div class="error-box" role="alert"><strong>Unable to reach the fleet service.</strong><p>${esc(error.message)}</p><button class="button" data-action="reload">Try again</button></div>`;
    }
  };
  const pageTitle = { overview: "Fleet overview", projects: "Projects", fleet: "Fleet", alarms: "Alarms", financials: "Financials", reports: "Reports", integrations: "Integrations" };
  const heading = (title, subtitle, action = "") => `<div class="page-heading"><div><h1>${esc(title)}</h1><p class="subtitle">${esc(subtitle)}</p></div>${action}</div>`;
  const panel = (title, body, note = "", action = "") => `<section class="panel"><div class="panel-head"><div><h2>${esc(title)}</h2>${note ? `<div class="panel-title-note">${esc(note)}</div>` : ""}</div>${action}</div><div class="panel-body">${body}</div></section>`;
  const empty = (title, text, button = "") => `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}${button ? `<div style="margin-top:12px">${button}</div>` : ""}</div>`;
  const metric = (label, value, note = "") => `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${value}</div>${note ? `<div class="metric-note">${esc(note)}</div>` : ""}</div>`;
  const attentionItems = () => {
    const items = state.data.summary.attention || [];
    return items.length ? `<div class="attention-list">${items.map(item => `<div class="attention-row">
      <div><div class="attention-title">${esc(item.message)}</div><div class="attention-meta">${esc(item.project)} · ${esc(item.serialNumber)}${item.lastSeenAt ? ` · Last communication ${esc(dateTime(item.lastSeenAt))}` : ""}</div></div>
      ${item.deviceId ? `<button class="attention-link" data-action="view-device" data-id="${esc(item.deviceId)}">View inverter</button>` : `<button class="attention-link" data-action="view-project" data-id="${esc(item.projectId)}">View project</button>`}
    </div>`).join("")}</div>` : empty("No issues need attention", "Fleet health looks good right now.");
  };
  const inverterTable = (devices, compact = false) => {
    if (!devices.length) return empty("No inverters have been added yet.", "Add an inverter to start monitoring your fleet.", `<button class="button primary" data-action="add-inverter">+ Add Inverter</button>`);
    const extraHeader = compact ? "" : "<th>Lifecycle</th><th>Cost</th>";
    const rows = devices.map(device => {
      const extraCells = compact ? "" : `<td>${status(device.lifecycleStatus)}</td><td class="mono">${money(device.purchaseCost)}</td>`;
      return `<tr>
        <td>${status(device.status)}</td>
        <td><button class="link-button" data-action="view-device" data-id="${esc(device.id)}">${esc(device.brand)} · ${esc(device.model)}</button></td>
        <td class="mono">${esc(device.serialNumber)}</td>
        <td>${esc(device.project)}<div class="muted small-text">${esc(device.site)}</div></td>
        <td class="mono">${number(device.ratedPowerKw)} kW</td>
        <td class="mono">${!device.telemetryFresh || device.pvPowerW == null ? "—" : `${number(device.pvPowerW)} W`}</td>
        <td>${esc(dateTime(device.lastSeenAt))}</td>
        <td>${status(device.integrationStatus)}</td>
        ${extraCells}
      </tr>`;
    }).join("");
    return `<div class="table-wrap"><table><thead><tr><th>Health</th><th>Manufacturer / model</th><th>Serial</th><th>Project · Site</th><th>Power</th><th>Output</th><th>Last communication</th><th>Integration</th>${extraHeader}</tr></thead><tbody>${rows}</tbody></table></div>`;
  };
  const render = () => {
    document.querySelectorAll(".nav-item").forEach(item => {
      if (item.dataset.page === state.page) item.setAttribute("aria-current", "page");
      else item.removeAttribute("aria-current");
    });
    if (!state.data) {
      main.innerHTML = `<div class="loading" role="status">Loading fleet information…</div>`;
      return;
    }
    if (state.selectedDevice) return renderDevice();
    if (state.page === "overview") return renderOverview();
    if (state.page === "projects") return state.selectedProject ? renderProject() : renderProjects();
    if (state.page === "fleet") return renderFleet();
    if (state.page === "alarms") return renderAlarms();
    if (state.page === "financials") return renderFinancials();

      <div class="form-field full"><label for="costNotes">Notes</label><textarea name="notes" id="costNotes" maxlength="2000"></textarea></div>
      <div class="form-field"><label for="costSite">Site</label><select name="siteId" id="costSite"><option value="">Project-wide</option>${state.data.sites.filter(site=>site.projectId===projectId).map(site=>`<option value="${esc(site.id)}">${esc(site.name)}</option>`).join("")}</select></div>
      <div class="form-field"><label for="costDevice">Inverter</label><select name="deviceId" id="costDevice"><option value="">Not equipment-specific</option>${state.data.devices.filter(device=>device.projectId===projectId&&device.lifecycleStatus!=="RETIRED").map(device=>`<option value="${esc(device.id)}" ${device.id===deviceId?"selected":""}>${esc(device.serialNumber)} · ${esc(device.model)}</option>`).join("")}</select></div>
      <div class="form-field full form-hint">Total is calculated from quantity × unit cost and rounded to cents.</div>
    </div>`, "Save cost");
    form.dataset.form = "add-cost";
    form.dataset.id = projectId;
  };
  const openRetireForm = id => {
    setupDialog("Remove inverter from fleet", `<p>Retire this inverter from active operations? Telemetry, alarms and costs will remain available in history.</p>
      <div class="form-grid"><div class="form-field"><label for="retireDate">Retirement date</label><input name="retiredAt" id="retireDate" type="date" value="${localDateValue()}"></div>
      <div class="form-field"><label for="retireReason">Reason</label><input name="reason" id="retireReason" maxlength="500" placeholder="e.g. Replaced after failure"></div>
      <div class="form-field full"><label for="retireNotes">Notes</label><textarea name="notes" id="retireNotes" maxlength="2000"></textarea></div></div>`, "Remove from Fleet");
    form.dataset.form = "retire-device"; form.dataset.id = id;
  };
  const serialize = formElement => {
    const data = {};
    new FormData(formElement).forEach((value,key) => {
      if (key === "saveMode" || value === "") return;
      const element = formElement.elements.namedItem(key);
      if (element?.type === "number") data[key] = Number(value);
      else data[key] = value;
    });
    return data;
  };
  const showFormError = message => { const el = $(".form-error",form); el.textContent = message; el.style.display = "block"; };
  const notify = message => { const el = document.createElement("div"); el.setAttribute("role","status"); el.className="notice"; el.textContent=message; main.prepend(el); setTimeout(()=>el.remove(),4500); };
  const csvCell = value => {
    const text=String(value ?? "");
    const safe=/^\s*[=+\-@]/.test(text) ? `'${text}` : text;
    return `"${safe.replaceAll('"','""')}"`;
  };
  const downloadCsv = (name, headers, rows) => {
    const csv = [headers, ...rows].map(row=>row.map(csvCell).join(",")).join("\r\n");
    const link = document.createElement("a"); link.href=URL.createObjectURL(new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"})); link.download=name; link.click(); URL.revokeObjectURL(link.href);
  };
  const exportReport = async () => {
    const type=$("#reportType")?.value || "fleet";
    const projectId=$("#reportProject")?.value || "";
    const project=state.data.projects.find(p=>p.id===projectId);
    if (["costs","savings","project"].includes(type) && !project) return notify("Choose a project before exporting this report.");
    await api("/api/v1/reports/generate",{method:"POST",body:JSON.stringify({type:type.toUpperCase(),projectId:project?.id||null})});
    const from=$("#reportFrom")?.value || state.reportFrom, to=$("#reportTo")?.value || state.reportTo;
    const within = value => (!from || String(value || "").slice(0,10) >= from) && (!to || String(value || "").slice(0,10) <= to);
    if(type==="fleet") return downloadCsv("fleet-report.csv",["Project","Site","Manufacturer","Model","Serial","Health","Lifecycle","Rated power kW","PV output W","Energy today kWh","Last communication","Integration"],state.data.devices.filter(d=>within(d.lastSeenAt)&&(!project||d.projectId===project.id)).map(d=>[d.project,d.site,d.brand,d.model,d.serialNumber,d.status,d.lifecycleStatus,d.ratedPowerKw,d.pvPowerW,d.pvEnergyTodayKwh,d.lastSeenAt,d.integrationStatus]));
    if(type==="alarms") return downloadCsv("alarm-report.csv",["Severity","Project","Site","Manufacturer","Serial","Code","Message","First seen","Last seen","Status","Acknowledged","Cleared"],state.data.alarms.filter(a=>within(a.occurredAt)&&(!project||a.projectId===project.id)).map(a=>[a.severity,a.project,a.site,a.brand,a.serialNumber,a.code,a.message,a.occurredAt,a.lastSeenAt,a.clearedAt?"Cleared":a.acknowledgedAt?"Acknowledged":"Open",a.acknowledgedAt,a.clearedAt]));
    if(type==="costs") return downloadCsv(`${project.name}-cost-report.csv`,["Date","Category","Description","Quantity","Unit cost","Total","Currency","Supplier","Reference"],(project._costs||[]).filter(c=>within(c.costDate)).map(c=>[c.costDate,c.category,c.description,c.quantity,c.unitCost,c.total,c.currency,c.supplier,c.reference]));
    if(type==="savings") return downloadCsv(`${project.name}-savings-report.csv`,["Project","Currency","Import tariff","Energy today kWh","Estimated daily savings","Estimated annual savings","Estimated annual return percent","Estimated payback years","Calculation basis"],[[project.name,project.currency,project.importTariff,project.energyTodayKwh,project.estimatedDailySavings,project.estimatedAnnualSavings,project.estimatedAnnualRoiPercent,project.estimatedPaybackYears,project.savingsBasis]]);
    return downloadCsv(`${project.name}-performance-report.csv`,["Project","Status","Capacity kW","Sites","Active inverters","Online","Offline","Faulted","Current PV output W","Energy today kWh","Open alarms"],[[project.name,project.status,project.capacityKw,project.siteCount,project.activeInverters,project.online,project.offline,project.faulted,project.pvPowerW,project.energyTodayKwh,state.data.alarms.filter(a=>a.projectId===project.id).length]]);
  };
  document.addEventListener("click", async event => {
    const button = event.target.closest("[data-action], [data-page]");
    if (!button) return;
    if (button.dataset.page) { state.page=button.dataset.page; state.selectedDevice=null; state.selectedProject=null; render(); return; }
    const action=button.dataset.action, id=button.dataset.id;
    try {
      if(action==="reload") return reload();
      if(action==="close-dialog") return dialog.close();
      if(action==="navigate") { state.page=button.dataset.page; state.selectedDevice=null; state.selectedProject=null; render(); return; }
      if(action==="add-inverter") return openInverterForm();
      if(action==="create-project") { if(dialog.open) dialog.close(); return openProjectForm(); }
      if(action==="edit-project") return openProjectForm(state.data.projects.find(p=>p.id===id));
      if(action==="add-site") return openSiteForm(button.dataset.project);
      if(action==="add-site-from-inverter") { const projectId=button.dataset.project; dialog.close(); return openSiteForm(projectId); }
      if(action==="add-cost") return openCostForm(button.dataset.project || state.selectedProject, button.dataset.device);
      if(action==="open-project") { state.page="projects"; state.selectedProject=id; state.projectTab="overview"; return render(); }
      if(action==="view-project") { state.page="projects"; state.selectedProject=id; state.projectTab="financials"; return render(); }
      if(action==="project-tab") { state.projectTab=button.dataset.tab; return render(); }
      if(action==="view-device") { state.page="fleet"; state.selectedDevice=id; state.telemetry=[]; state.historyDays=7; render(); try { state.telemetry=await api(`/api/v1/devices/${id}/telemetry`); render(); } catch(error) { notify(`Could not load telemetry history: ${error.message}`); } return; }
      if(action==="back-fleet") { state.selectedDevice=null; state.page="fleet"; return render(); }
      if(action==="edit-device") return openInverterForm(state.data.devices.find(d=>d.id===id));
      if(action==="retire-device") return openRetireForm(id);
      if(action==="restore-device") { await api(`/api/v1/devices/${id}/restore`,{method:"POST"}); state.selectedDevice=null; await reload(); notify("Inverter restored to the active fleet."); return; }
      if(action==="maintenance") { await api(`/api/v1/devices/${id}/maintenance`,{method:"POST",body:JSON.stringify({maintenance:button.dataset.value==="true"})}); await reload(); notify(button.dataset.value==="true"?"Inverter marked for maintenance.":"Inverter returned to active service."); return; }
      if(action==="ack-alarm") { await api(`/api/v1/alarms/${id}/acknowledge`,{method:"POST"}); await reload(); return; }
      if(action==="clear-alarm" && confirm("Clear this alarm? It will remain in the alarm history.")) { await api(`/api/v1/alarms/${id}/clear`,{method:"POST"}); await reload(); return; }
      if(action==="view-costs") { state.page="reports"; state.reportType="costs"; state.reportProject=id; render(); return; }
      if(action==="project-report") { state.page="reports"; state.reportType="project"; state.reportProject=id; render(); setTimeout(()=>{const select=$("#reportProject"); if(select){select.value=id;select.dispatchEvent(new Event("change"));}},0); return; }
      if(action==="print-report") { window.print(); return; }
      if(action==="export-report") { await exportReport(); return; }
    } catch(error) { notify(error.message); }
  });
  document.addEventListener("input", event => {
    if(event.target.id==="fleetSearch") {
      const start=event.target.selectionStart, end=event.target.selectionEnd;
      renderFleet();
      const input=$("#fleetSearch"); input?.focus(); input?.setSelectionRange(start,end);
    }
  });
  document.addEventListener("change", event => {
    if(["fleetProject","fleetHealth","fleetBrand","fleetIntegration","fleetSite","fleetLifecycle","fleetSort","fleetDirection"].includes(event.target.id)) return renderFleet();
    if(["alarmStatus","alarmSeverity","alarmProject","alarmSite","alarmDevice"].includes(event.target.id)) return renderAlarms();
    if(["reportType","reportProject","reportFrom","reportTo"].includes(event.target.id)) { state.reportType=$("#reportType").value; state.reportProject=$("#reportProject").value; state.reportFrom=$("#reportFrom").value; state.reportTo=$("#reportTo").value; renderReports(); }
    if(event.target.id==="historyDays") { state.historyDays=Number(event.target.value); renderDevice(); }
    if(event.target.id==="historyFrom"||event.target.id==="historyTo") { state.historyFrom=$("#historyFrom").value; state.historyTo=$("#historyTo").value; renderDevice(); }
  });
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if(!form.reportValidity()) return;
    const kind=form.dataset.form, id=form.dataset.id, data=serialize(form);
    const submitter=event.submitter;
    const another=submitter?.value==="another";
    const submitButton=submitter;
    if(submitButton) submitButton.disabled=true;
    try {
      if(kind==="add-device") await api("/api/v1/devices",{method:"POST",body:JSON.stringify(data)});
      if(kind==="edit-device") await api(`/api/v1/devices/${id}`,{method:"PUT",body:JSON.stringify(data)});
      if(kind==="create-project") {
        const created=await api("/api/v1/projects",{method:"POST",body:JSON.stringify(data)});
        await reload(); state.page="projects"; state.selectedProject=created.id; state.projectTab="overview"; render();
        if(another){dialog.close();openProjectForm();return;}
        dialog.close();notify("Project created.");return;
      }
      if(kind==="edit-project") await api(`/api/v1/projects/${id}`,{method:"PUT",body:JSON.stringify(data)});
      if(kind==="add-site") await api(`/api/v1/projects/${id}/sites`,{method:"POST",body:JSON.stringify(data)});
      if(kind==="add-cost") await api(`/api/v1/projects/${id}/costs`,{method:"POST",body:JSON.stringify(data)});
      if(kind==="retire-device") await api(`/api/v1/devices/${id}/retire`,{method:"POST",body:JSON.stringify(data)});
      if(another && kind==="add-device") {
        const projectId=state.data.sites.find(site=>site.id===data.siteId)?.projectId || "";
        dialog.close(); await reload(); openInverterForm(null,projectId); notify("Inverter added. Add the next one when ready."); return;
      }
      dialog.close();
      if(kind==="edit-device") state.selectedDevice=id;
      if(kind==="retire-device") state.selectedDevice=id;
      await reload();
      notify(kind==="add-device"?"Inverter added to the fleet.":kind==="edit-device"?"Inverter details updated.":kind==="add-cost"?"Project cost recorded.":kind==="add-site"?"Site added to project.":kind==="retire-device"?"Inverter retired. History has been preserved.":"Changes saved.");
    } catch(error) { showFormError(error.message); }
    finally { if(submitButton) submitButton.disabled=false; }
  });
  dialog.addEventListener("click", event => { if(event.target===dialog) dialog.close(); });
  render();
  reload();
  setInterval(reload,60000);
})();
</script>
</body>
</html>
