spring:
  application:
    name: solar-fleet-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solarfleet}
    username: ${DB_USERNAME:solarfleet}
    password: ${DB_PASSWORD:solarfleet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: Africa/Johannesburg

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

platform:
  demo-data: ${APP_DEMO_DATA:true}
  operator-api-key: ${OPERATOR_API_KEY:}
  tenant-id: ${TENANT_ID:}
  polling:
    initial-delay-ms: ${POLLING_INITIAL_DELAY_MS:1500}
    fixed-delay-ms: ${POLLING_FIXED_DELAY_MS:60000}

logging:
  level:
    za.co.solar.fleet: INFO
