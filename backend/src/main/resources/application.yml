spring:
  application:
    name: solar-fleet-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solarfleet}
    username: ${DB_USERNAME:solarfleet}
    password: ${DB_PASSWORD:solarfleet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: solarfleet-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: Africa/Johannesburg
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
  compression:
    enabled: true
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}
    threads:
      max: ${SERVER_MAX_THREADS:50}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

platform:
  demo-data: ${APP_DEMO_DATA:true}
  operator-api-key: ${OPERATOR_API_KEY:}
  tenant-id: ${TENANT_ID:}
  polling:
    initial-delay-ms: ${POLLING_INITIAL_DELAY_MS:1500}
    fixed-delay-ms: ${POLLING_FIXED_DELAY_MS:60000}
  network:
    connect-timeout-ms: ${OEM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OEM_READ_TIMEOUT_MS:15000}

logging:
  level:
    za.co.solar.fleet: INFO
