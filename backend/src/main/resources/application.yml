spring:
  application:
    name: solar-fleet-mvp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solarfleet}
    username: ${DB_USERNAME:solarfleet}
    password: ${DB_PASSWORD:solarfleet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: Africa/Johannesburg
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Set FORWARD_HEADERS=framework ONLY when the app is reachable exclusively through a trusted
  # reverse proxy (the bundled docker-compose stack does this).
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

platform:
  # SECURE BY DEFAULT: demo mode (synthetic data, unauthenticated API) must be opted into with
  # APP_DEMO_DATA=true or SPRING_PROFILES_ACTIVE=demo. Otherwise OPERATOR_API_KEY and TENANT_ID are required.
  demo-data: ${APP_DEMO_DATA:false}
  operator-api-key: ${OPERATOR_API_KEY:}
  tenant-id: ${TENANT_ID:}
  tenant-name: ${TENANT_NAME:Operator}
  polling:
    enabled: ${POLLING_ENABLED:true}
    initial-delay-ms: ${POLLING_INITIAL_DELAY_MS:1500}
    fixed-delay-ms: ${POLLING_FIXED_DELAY_MS:60000}
  telemetry:
    # Rows older than this are purged nightly (the newest reading per device is always kept). 0 disables.
    retention-days: ${TELEMETRY_RETENTION_DAYS:90}
    retention-cron: ${TELEMETRY_RETENTION_CRON:0 30 2 * * *}
  outbound:
    connect-timeout-ms: ${OUTBOUND_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OUTBOUND_READ_TIMEOUT_MS:15000}
    allow-http: ${OUTBOUND_ALLOW_HTTP:false}
    allow-private-networks: ${OUTBOUND_ALLOW_PRIVATE_NETWORKS:false}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    za.co.solar.fleet: INFO
