# Edge proxy: the only container reachable from the host. Terminate TLS here or in a load balancer in front of it.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_types application/json text/css application/javascript text/html;

    # Operational endpoints are for the platform, not the public.
    location /actuator/ { return 404; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params.conf;
    }
}
